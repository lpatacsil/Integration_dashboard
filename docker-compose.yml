services:
  # Legacy/dormant: kept so the Postgres path (database/migrations, api/src/db.ts)
  # can be re-enabled later without losing local dev setup. Not used by the API
  # by default anymore — see the `azurite` service below.
  postgres:
    image: postgres:16-alpine
    container_name: integration_monitor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["postgres"]

  # Azure Storage emulator for local dev — the API's default storage backend.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: integration_monitor_azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    ports:
      - "12010:10000"
    volumes:
      - azuritedata:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integration_monitor_api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-teamcentral-logs}
      API_PORT: "3001"
      NETSUITE_ACCOUNT_ID: ${NETSUITE_ACCOUNT_ID:-}
      NETSUITE_CONSUMER_KEY: ${NETSUITE_CONSUMER_KEY:-}
      NETSUITE_CONSUMER_SECRET: ${NETSUITE_CONSUMER_SECRET:-}
      NETSUITE_TOKEN_ID: ${NETSUITE_TOKEN_ID:-}
      NETSUITE_TOKEN_SECRET: ${NETSUITE_TOKEN_SECRET:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      - azurite

volumes:
  pgdata:
  azuritedata:
