services:
  postgres:
    image: postgres:16-alpine
    container_name: integration_monitor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integration_monitor_api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_PORT: "3001"
      NETSUITE_ACCOUNT_ID: ${NETSUITE_ACCOUNT_ID:-}
      NETSUITE_CONSUMER_KEY: ${NETSUITE_CONSUMER_KEY:-}
      NETSUITE_CONSUMER_SECRET: ${NETSUITE_CONSUMER_SECRET:-}
      NETSUITE_TOKEN_ID: ${NETSUITE_TOKEN_ID:-}
      NETSUITE_TOKEN_SECRET: ${NETSUITE_TOKEN_SECRET:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
