name: Build and Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

env:
  SCM_HOST: integration-dashboard-erdxhhczasejb4hj.scm.westus3-01.azurewebsites.net
  APP_HOST: integration-dashboard-erdxhhczasejb4hj.westus3-01.azurewebsites.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code from repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json

      # 3. Build frontend
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 4. Build API
      - name: Build API
        working-directory: api
        run: |
          npm ci
          npx tsc

      # 5. Copy frontend build into API public folder
      - name: Copy frontend to API public
        run: |
          mkdir -p api/public
          rm -rf api/public/assets api/public/index.html
          cp -r frontend/dist/* api/public/

      # 6. Create deployment zip
      - name: Create deployment package
        working-directory: api
        run: |
          zip -r deploy.zip dist/ public/ package.json package-lock.json node_modules/

      # 7. Deploy zip via Kudu API
      - name: Deploy to Azure Web App
        run: |
          HTTP_CODE=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" -X POST \
            --user "${{ secrets.AZURE_DEPLOY_USER }}:${{ secrets.AZURE_DEPLOY_PASSWORD }}" \
            --data-binary @api/deploy.zip \
            -H "Content-Type: application/zip" \
            "https://${{ env.SCM_HOST }}/api/zipdeploy?isAsync=true")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/deploy_response.txt || true
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Deployment failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Zip deploy initiated. Waiting for deployment to complete..."
          sleep 30

      # 8. Verify deployment
      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 30
          curl -sf "https://${{ env.APP_HOST }}/api/health" || echo "App is still starting up..."
          echo ""
          echo "Deployment complete: https://${{ env.APP_HOST }}"
