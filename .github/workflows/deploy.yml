name: Build and Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

env:
  APP_NAME: integration-dashboard

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code from repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json

      # 3. Build frontend
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 4. Build API
      - name: Build API
        working-directory: api
        run: |
          npm ci
          npx tsc

      # 5. Copy frontend build into API public folder
      - name: Copy frontend to API public
        run: |
          rm -rf api/public/assets api/public/index.html
          cp -r frontend/dist/* api/public/

      # 6. Create deployment zip
      - name: Create deployment package
        working-directory: api
        run: |
          zip -r deploy.zip dist/ public/ package.json package-lock.json node_modules/

      # 7. Deploy zip to Azure Web App using publish profile
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api/deploy.zip

      # 8. Verify deployment
      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 30
          curl -sf "https://integration-dashboard-erdxhhczasejb4hj.westus3-01.azurewebsites.net/api/health" || echo "App is still starting up..."
          echo ""
          echo "Deployment complete: https://integration-dashboard-erdxhhczasejb4hj.westus3-01.azurewebsites.net"
